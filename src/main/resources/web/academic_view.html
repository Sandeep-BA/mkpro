<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mkpro — Borderless Academic Research Canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #F6F5F0;
            --bg-paper: #FAF9F6;
            --bg-ivory: #F4F2EB;
            --ink-primary: #1C1E21;
            --ink-secondary: #4B525D;
            --ink-muted: #7E8694;
            --accent-sage: #2C6B4F;
            --radius-xs: 6px;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-pill: 9999px;
            --ambient-shadow-sm: 0 4px 20px -4px rgba(28, 30, 33, 0.03), 0 2px 6px -1px rgba(28, 30, 33, 0.02);
            --ambient-shadow-md: 0 12px 36px -8px rgba(28, 30, 33, 0.05), 0 4px 12px -2px rgba(28, 30, 33, 0.03);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-canvas); color: var(--ink-primary); padding: 40px; }
        .container { max-width: 1200px; margin: 0 auto; }

        /* Corpus Workspace Component */
        .corpus-workspace {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 24px;
            margin-top: 40px;
        }

        .academic-card {
            background: linear-gradient(150deg, var(--bg-paper) 0%, var(--bg-ivory) 100%);
            border-radius: var(--radius-md);
            padding: 24px;
            box-shadow: var(--ambient-shadow-md);
        }

        .corpus-search-input {
            width: 100%;
            background: rgba(255,255,255,0.7);
            border: none;
            padding: 10px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            font-size: 13px;
        }

        .file-tree { list-style: none; }
        .file-item {
            padding: 8px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }
        .file-item:hover { background: rgba(0,0,0,0.03); }

        .manuscript-view {
            padding: 32px;
            font-family: 'JetBrains Mono', monospace;
            background: #FFF;
            border-radius: var(--radius-md);
            box-shadow: var(--ambient-shadow-sm);
            white-space: pre-wrap;
            color: var(--ink-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 style="font-family: 'Newsreader', serif; font-size: 32px;">Project Corpus</h1>
        </header>

        <section class="corpus-workspace">
            <aside class="academic-card">
                <input type="text" placeholder="Search corpus..." class="corpus-search-input">
                <ul class="file-tree">
                    <li class="file-item">📁 src/main/java <span>48 files</span></li>
                    <li class="file-item" style="padding-left: 20px;">📄 Controller.java <span>12KB</span></li>
                    <li class="file-item" style="padding-left: 20px;">📄 Service.java <span>8KB</span></li>
                    <li class="file-item">📁 datajsonl <span>12 files</span></li>
                    <li class="file-item">📄 pom.xml <span>3KB</span></li>
                </ul>
            </aside>

            <article class="manuscript-view">
                <div style="color: var(--ink-muted); margin-bottom: 20px;">// Manuscript Preview: Select a file</div>
                <p>Welcome to the MKPro Corpus Explorer. Select a file from the left to view its contents.</p>
            </article>
        </section>
    </div>
</body>
</html>
